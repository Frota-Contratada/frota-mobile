name: Mobile Checks

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Validate mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        id: java
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        id: flutter
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        id: dependencies
        continue-on-error: true
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze

      - name: Tests
        id: tests
        continue-on-error: true
        run: flutter test

      - name: Debug build
        id: build
        continue-on-error: true
        run: flutter build apk --debug

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Mobile checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"

          result() {
            if [ "$2" = "success" ]; then
              echo "| $1 | PASSED |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | WARNING: $2 |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$1: $2"
            fi
          }

          result "Java" "${{ steps.java.outcome }}"
          result "Flutter" "${{ steps.flutter.outcome }}"
          result "Dependencies" "${{ steps.dependencies.outcome }}"
          result "Analyze" "${{ steps.analyze.outcome }}"
          result "Tests" "${{ steps.tests.outcome }}"
          result "Debug build" "${{ steps.build.outcome }}"
