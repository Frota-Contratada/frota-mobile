name: Mobile DEMO

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: URL HTTPS publica do gateway DEMO, sem barra final
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Validate public endpoint
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: |
          case "$PUBLIC_URL" in
            https://*) ;;
            *) echo "public_url must use HTTPS" >&2; exit 1 ;;
          esac
          test "${PUBLIC_URL%/}" = "$PUBLIC_URL" || { echo "public_url must not end with /" >&2; exit 1; }
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build DEMO release APK
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
        run: |
          flutter build apk --release --no-pub \
            --dart-define=BASE_URL="$PUBLIC_URL/api" \
            --dart-define=TRIP_WEBAPP_URL="$PUBLIC_URL/acompanhamento" \
            --dart-define=TRIP_SOCKET_URL="$PUBLIC_URL" \
            --dart-define=TRIP_TRACKING_BASE_URL="$PUBLIC_URL/api/corridas"
          SOURCE_SHA="${GITHUB_SHA:0:12}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/frota-mobile-demo-$SOURCE_SHA.apk"
          sha256sum build/app/outputs/flutter-apk/frota-mobile-demo-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: frota-mobile-demo-${{ github.sha }}
          path: build/app/outputs/flutter-apk/frota-mobile-demo-*.apk
          if-no-files-found: error
          retention-days: 14
